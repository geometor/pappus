<svg xmlns="http://www.w3.org/2000/svg" class="euclid-graphic" viewBox="0 0 680 440" data-graphic-id="g2" role="img" aria-label="Pascal&#x27;s Hexagrammum Mysticum on the Ellipse x^2/4 + y^2 = 1">
  <title>Pascal&#x27;s Hexagrammum Mysticum on the Ellipse x^2/4 + y^2 = 1</title>
  <style>
.euclid-graphic {
    --svg-bg: #fafaf9;
    --ink: #1c1917;
    --label-halo: rgba(250, 250, 249, 0.92);
    --carrier: #475569;
    --conic: #0284c7;
    --cross: #0e7490;
    --quad: #4338ca;
    --pappus-even: #d97706;
    --pappus-odd: #db2777;
    --steiner: #7c3aed;
    --harmonic: #059669;
    --golden: #b45309;
    --pt-given: #0f172a;
    --pt-a: #0369a1;
    --pt-b: #0f766e;
    --pt-meet-even: #d97706;
    --pt-meet-odd: #db2777;
    --pt-steiner: #7c3aed;
    --pt-harmonic: #059669;
    --tri-square: #d97706;
    --tri-circle: #0284c7;
    --tri-diamond: #db2777;
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    .euclid-graphic {
      --svg-bg: #141417;
      --ink: #f4f4f5;
      --label-halo: rgba(20, 20, 23, 0.92);
      --carrier: #94a3b8;
      --conic: #38bdf8;
      --cross: #38bdf8;
      --quad: #818cf8;
      --pappus-even: #fbbf24;
      --pappus-odd: #f472b6;
      --steiner: #c084fc;
      --harmonic: #34d399;
      --golden: #facc15;
      --pt-given: #e2e8f0;
      --pt-a: #38bdf8;
      --pt-b: #2dd4bf;
      --pt-meet-even: #fbbf24;
      --pt-meet-odd: #f472b6;
      --pt-steiner: #c084fc;
      --pt-harmonic: #34d399;
      --tri-square: #fbbf24;
      --tri-circle: #38bdf8;
      --tri-diamond: #f472b6;
    }
  }
  .euclid-graphic .svg-bg { fill: var(--svg-bg); }
  .euclid-graphic .geom-circle.conic-curve { fill: none; stroke: var(--conic); stroke-width: 2.15; opacity: 0.88; }
  .euclid-graphic .geom-line { fill: none; stroke: var(--carrier); stroke-width: 1.6; stroke-linecap: round; }
  .euclid-graphic .carrier-line { stroke: var(--carrier); stroke-width: 2.1; opacity: 0.92; }
  .euclid-graphic .cross-line { stroke: var(--cross); stroke-width: 1.25; stroke-opacity: 0.58; }
  .euclid-graphic .quad-line { stroke: var(--quad); stroke-width: 1.45; stroke-opacity: 0.78; }
  .euclid-graphic .diagonal-line { stroke-dasharray: 5 3.5; }
  .euclid-graphic .pappus-line { stroke-width: 2.7; opacity: 0.96; }
  .euclid-graphic .pappus-even { stroke: var(--pappus-even); }
  .euclid-graphic .pappus-odd { stroke: var(--pappus-odd); }
  .euclid-graphic .steiner-line { stroke: var(--steiner); stroke-width: 2.5; stroke-dasharray: 7 4; }
  .euclid-graphic .harmonic-line { stroke: var(--harmonic); stroke-width: 2.5; }
  .euclid-graphic .geom-segment.golden-segment { fill: none; stroke: var(--golden); stroke-width: 3.6; stroke-linecap: round; opacity: 0.85; }
  .euclid-graphic .geom-segment.harmonic-segment { fill: none; stroke: var(--harmonic); stroke-width: 3.2; stroke-linecap: round; opacity: 0.75; }
  .euclid-graphic .geom-polygon.hexagon-poly { fill: var(--cross); fill-opacity: 0.06; stroke: var(--cross); stroke-width: 1.5; stroke-opacity: 0.4; stroke-linejoin: round; }
  .euclid-graphic .geom-polygon.tri-square { fill: var(--tri-square); fill-opacity: 0.09; stroke: var(--tri-square); stroke-width: 1.9; stroke-linejoin: round; }
  .euclid-graphic .geom-polygon.tri-circle { fill: var(--tri-circle); fill-opacity: 0.09; stroke: var(--tri-circle); stroke-width: 1.9; stroke-linejoin: round; }
  .euclid-graphic .geom-polygon.tri-diamond { fill: var(--tri-diamond); fill-opacity: 0.09; stroke: var(--tri-diamond); stroke-width: 1.9; stroke-linejoin: round; }
  .euclid-graphic .geom-point { fill: var(--pt-given); stroke: var(--svg-bg); stroke-width: 1.5; }
  .euclid-graphic .pt-a { fill: var(--pt-a); }
  .euclid-graphic .pt-b { fill: var(--pt-b); }
  .euclid-graphic .meet-point.pappus-even { fill: var(--pt-meet-even); }
  .euclid-graphic .meet-point.pappus-odd { fill: var(--pt-meet-odd); }
  .euclid-graphic .steiner-point { fill: var(--pt-steiner); stroke-width: 2.0; }
  .euclid-graphic .harmonic-point { fill: var(--pt-harmonic); stroke-width: 1.8; }
  .euclid-graphic .aux-point { opacity: 0.78; }
  .euclid-graphic .geom-label {
    fill: var(--ink);
    font-size: 13.5px;
    font-weight: 600;
    paint-order: stroke fill;
    stroke: var(--label-halo);
    stroke-width: 3.6px;
    stroke-linejoin: round;
    user-select: none;
  }
  .euclid-graphic .geom-label-sub { font-size: 10px; font-weight: 600; }
  </style>
  <rect class="svg-bg" x="0" y="0" width="680" height="440" rx="6" fill="none" />
  <g id="elements">
    <g id="graphics">
      <ellipse class="geom-circle conic-curve" cx="268.24" cy="246.91" rx="179.39" ry="89.7" data-ref="( O P0 )" data-aliases="( O P1 ) | ( O P2 ) | ( O P3 ) | ( O P4 ) | ( O P5 ) | ( P0 P1 P2 )" fill="none"><title>( O P0 ): x**2/4 + y**2 - 1 = 0</title></ellipse>
      <polygon class="geom-polygon hexagon-poly" points="447.64,246.91 268.24,157.21 160.61,318.67 411.76,193.09 124.73,193.09 375.88,318.67" data-ref="&lt; P0 P2 P4 P1 P3 P5 &gt;" fill="none" />
      <path class="geom-line cross-line" d="M 14 30.09 L 340 193.09 L 666 356.09" data-ref="[ P0 P2 ]" data-aliases="[ P0 M03 ] | [ P2 M03 ]" fill="none"><title>[ P0 P2 ]: -x - 2*y + 2 = 0</title></path>
      <path class="geom-line cross-line" d="M 89.05 426 L 226.38 220 L 363.72 14" data-ref="[ P2 P4 ]" data-aliases="[ P2 M14 ] | [ P4 M14 ]" fill="none"><title>[ P2 P4 ]: 9*x/5 - 6*y/5 + 6/5 = 0</title></path>
      <path class="geom-line cross-line" d="M 14 391.97 L 340 228.97 L 666 65.97" data-ref="[ P4 P1 ]" data-aliases="[ P1 P4 ] | [ P1 M25 ] | [ P4 M25 ]" fill="none"><title>[ P4 P1 ]: -7*x/5 + 14*y/5 + 14/25 = 0</title></path>
      <path class="geom-line cross-line" d="M 14 193.09 L 340 193.09 L 666 193.09" data-ref="[ P1 P3 ]" data-aliases="[ P1 M03 ] | [ P3 M03 ]" fill="none"><title>[ P1 P3 ]: y - 3/5 = 0</title></path>
      <path class="geom-line cross-line" d="M 14 137.73 L 302.27 281.86 L 590.55 426" data-ref="[ P3 P5 ]" data-aliases="[ P3 M14 ] | [ P5 M14 ]" fill="none"><title>[ P3 P5 ]: 7*x/5 + 14*y/5 + 14/25 = 0</title></path>
      <path class="geom-line cross-line" d="M 666 28.55 L 467.27 227.27 L 268.55 426" data-ref="[ P5 P0 ]" data-aliases="[ P0 P5 ] | [ P0 M25 ] | [ P5 M25 ]" fill="none"><title>[ P5 P0 ]: -4*x/5 + 4*y/5 + 8/5 = 0</title></path>
      <path class="geom-line pappus-line pappus-even" d="M 14 309.52 L 340 193.09 L 666 76.66" data-ref="[ M03 M14 ]" data-aliases="[ M03 M25 ] | [ M14 M25 ]" fill="none"><title>[ M03 M14 ]: x/2 - 7*y/5 + 11/25 = 0</title></path>
    </g>
    <g id="highlights"></g>
    <g id="points">
      <circle class="geom-point" cx="268.24" cy="246.91" r="3.8" data-ref="O" data-latex-x="0" data-latex-y="0"><title>O = (0, 0)</title></circle>
      <circle class="geom-point given-point" cx="447.64" cy="246.91" r="4.2" data-ref="P0" data-latex-x="2" data-latex-y="0"><title>P0 = (2, 0)</title></circle>
      <circle class="geom-point given-point" cx="411.76" cy="193.09" r="4.2" data-ref="P1" data-latex-x="\frac{8}{5}" data-latex-y="\frac{3}{5}"><title>P1 = (8/5, 3/5)</title></circle>
      <circle class="geom-point given-point" cx="268.24" cy="157.21" r="4.2" data-ref="P2" data-latex-x="0" data-latex-y="1"><title>P2 = (0, 1)</title></circle>
      <circle class="geom-point given-point" cx="124.73" cy="193.09" r="4.2" data-ref="P3" data-latex-x="- \frac{8}{5}" data-latex-y="\frac{3}{5}"><title>P3 = (-8/5, 3/5)</title></circle>
      <circle class="geom-point given-point" cx="160.61" cy="318.67" r="4.2" data-ref="P4" data-latex-x="- \frac{6}{5}" data-latex-y="- \frac{4}{5}"><title>P4 = (-6/5, -4/5)</title></circle>
      <circle class="geom-point given-point" cx="375.88" cy="318.67" r="4.2" data-ref="P5" data-latex-x="\frac{6}{5}" data-latex-y="- \frac{4}{5}"><title>P5 = (6/5, -4/5)</title></circle>
      <circle class="geom-point-halo" cx="340" cy="193.09" r="8.9" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.6" />
      <circle class="geom-point meet-point pappus-even" cx="340" cy="193.09" r="4.7" data-ref="M03" data-latex-x="\frac{4}{5}" data-latex-y="\frac{3}{5}"><title>M03 = (4/5, 3/5)</title></circle>
      <circle class="geom-point-halo" cx="214.42" cy="237.94" r="8.9" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.6" />
      <circle class="geom-point meet-point pappus-even" cx="214.42" cy="237.94" r="4.7" data-ref="M14" data-latex-x="- \frac{3}{5}" data-latex-y="\frac{1}{10}"><title>M14 = (-3/5, 1/10)</title></circle>
      <circle class="geom-point-halo" cx="591.15" cy="103.39" r="8.9" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.6" />
      <circle class="geom-point meet-point pappus-even" cx="591.15" cy="103.39" r="4.7" data-ref="M25" data-latex-x="\frac{18}{5}" data-latex-y="\frac{8}{5}"><title>M25 = (18/5, 8/5)</title></circle>
    </g>
    <g id="labels">
      <text class="geom-label" x="275.05" y="237.18" data-ref="O">O</text>
      <text class="geom-label" x="439" y="232.47" data-ref="P0">P<tspan class="geom-label-sub" dy="3">0</tspan></text>
      <text class="geom-label" x="403.12" y="217.05" data-ref="P1">P<tspan class="geom-label-sub" dy="3">1</tspan></text>
      <text class="geom-label" x="259.6" y="181.17" data-ref="P2">P<tspan class="geom-label-sub" dy="3">2</tspan></text>
      <text class="geom-label" x="116.09" y="178.65" data-ref="P3">P<tspan class="geom-label-sub" dy="3">3</tspan></text>
      <text class="geom-label" x="137.68" y="308.63" data-ref="P4">P<tspan class="geom-label-sub" dy="3">4</tspan></text>
      <text class="geom-label" x="367.24" y="304.23" data-ref="P5">P<tspan class="geom-label-sub" dy="3">5</tspan></text>
      <text class="geom-label" x="328.57" y="178.15" data-ref="M03">M<tspan class="geom-label-sub" dy="3">03</tspan></text>
      <text class="geom-label" x="202.99" y="262.4" data-ref="M14">M<tspan class="geom-label-sub" dy="3">14</tspan></text>
      <text class="geom-label" x="579.72" y="88.45" data-ref="M25">M<tspan class="geom-label-sub" dy="3">25</tspan></text>
    </g>
  </g>
</svg>
