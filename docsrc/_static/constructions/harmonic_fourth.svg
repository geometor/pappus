<svg xmlns="http://www.w3.org/2000/svg" class="euclid-graphic" viewBox="0 0 680 440" data-graphic-id="g1" role="img" aria-label="Complete Quadrilateral Straightedge Construction of Fourth Harmonic D">
  <title>Complete Quadrilateral Straightedge Construction of Fourth Harmonic D</title>
  <style>
.euclid-graphic {
    --svg-bg: #fafaf9;
    --ink: #1c1917;
    --label-halo: rgba(250, 250, 249, 0.92);
    --carrier: #475569;
    --conic: #0284c7;
    --cross: #0e7490;
    --quad: #4338ca;
    --pappus-even: #d97706;
    --pappus-odd: #db2777;
    --steiner: #7c3aed;
    --harmonic: #059669;
    --golden: #b45309;
    --pt-given: #0f172a;
    --pt-a: #0369a1;
    --pt-b: #0f766e;
    --pt-meet-even: #d97706;
    --pt-meet-odd: #db2777;
    --pt-steiner: #7c3aed;
    --pt-harmonic: #059669;
    --tri-square: #d97706;
    --tri-circle: #0284c7;
    --tri-diamond: #db2777;
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    .euclid-graphic {
      --svg-bg: #141417;
      --ink: #f4f4f5;
      --label-halo: rgba(20, 20, 23, 0.92);
      --carrier: #94a3b8;
      --conic: #38bdf8;
      --cross: #38bdf8;
      --quad: #818cf8;
      --pappus-even: #fbbf24;
      --pappus-odd: #f472b6;
      --steiner: #c084fc;
      --harmonic: #34d399;
      --golden: #facc15;
      --pt-given: #e2e8f0;
      --pt-a: #38bdf8;
      --pt-b: #2dd4bf;
      --pt-meet-even: #fbbf24;
      --pt-meet-odd: #f472b6;
      --pt-steiner: #c084fc;
      --pt-harmonic: #34d399;
      --tri-square: #fbbf24;
      --tri-circle: #38bdf8;
      --tri-diamond: #f472b6;
    }
  }
  .euclid-graphic .svg-bg { fill: var(--svg-bg); }
  .euclid-graphic .geom-circle.conic-curve { fill: none; stroke: var(--conic); stroke-width: 2.15; opacity: 0.88; }
  .euclid-graphic .geom-line { fill: none; stroke: var(--carrier); stroke-width: 1.6; stroke-linecap: round; }
  .euclid-graphic .carrier-line { stroke: var(--carrier); stroke-width: 2.1; opacity: 0.92; }
  .euclid-graphic .cross-line { stroke: var(--cross); stroke-width: 1.25; stroke-opacity: 0.58; }
  .euclid-graphic .quad-line { stroke: var(--quad); stroke-width: 1.45; stroke-opacity: 0.78; }
  .euclid-graphic .diagonal-line { stroke-dasharray: 5 3.5; }
  .euclid-graphic .pappus-line { stroke-width: 2.7; opacity: 0.96; }
  .euclid-graphic .pappus-even { stroke: var(--pappus-even); }
  .euclid-graphic .pappus-odd { stroke: var(--pappus-odd); }
  .euclid-graphic .steiner-line { stroke: var(--steiner); stroke-width: 2.5; stroke-dasharray: 7 4; }
  .euclid-graphic .harmonic-line { stroke: var(--harmonic); stroke-width: 2.5; }
  .euclid-graphic .geom-segment.golden-segment { fill: none; stroke: var(--golden); stroke-width: 3.6; stroke-linecap: round; opacity: 0.85; }
  .euclid-graphic .geom-segment.harmonic-segment { fill: none; stroke: var(--harmonic); stroke-width: 3.2; stroke-linecap: round; opacity: 0.75; }
  .euclid-graphic .geom-polygon.hexagon-poly { fill: var(--cross); fill-opacity: 0.06; stroke: var(--cross); stroke-width: 1.5; stroke-opacity: 0.4; stroke-linejoin: round; }
  .euclid-graphic .geom-polygon.tri-square { fill: var(--tri-square); fill-opacity: 0.09; stroke: var(--tri-square); stroke-width: 1.9; stroke-linejoin: round; }
  .euclid-graphic .geom-polygon.tri-circle { fill: var(--tri-circle); fill-opacity: 0.09; stroke: var(--tri-circle); stroke-width: 1.9; stroke-linejoin: round; }
  .euclid-graphic .geom-polygon.tri-diamond { fill: var(--tri-diamond); fill-opacity: 0.09; stroke: var(--tri-diamond); stroke-width: 1.9; stroke-linejoin: round; }
  .euclid-graphic .geom-point { fill: var(--pt-given); stroke: var(--svg-bg); stroke-width: 1.5; }
  .euclid-graphic .pt-a { fill: var(--pt-a); }
  .euclid-graphic .pt-b { fill: var(--pt-b); }
  .euclid-graphic .meet-point.pappus-even { fill: var(--pt-meet-even); }
  .euclid-graphic .meet-point.pappus-odd { fill: var(--pt-meet-odd); }
  .euclid-graphic .steiner-point { fill: var(--pt-steiner); stroke-width: 2.0; }
  .euclid-graphic .harmonic-point { fill: var(--pt-harmonic); stroke-width: 1.8; }
  .euclid-graphic .aux-point { opacity: 0.78; }
  .euclid-graphic .geom-label {
    fill: var(--ink);
    font-size: 13.5px;
    font-weight: 600;
    paint-order: stroke fill;
    stroke: var(--label-halo);
    stroke-width: 3.6px;
    stroke-linejoin: round;
    user-select: none;
  }
  .euclid-graphic .geom-label-sub { font-size: 10px; font-weight: 600; }
  </style>
  <rect class="svg-bg" x="0" y="0" width="680" height="440" rx="6" fill="none" />
  <g id="elements">
    <g id="graphics">
      <path class="geom-line quad-line" d="M 193.68 426 L 399.68 220 L 605.68 14" data-ref="[ P A ]" data-aliases="[ A P ] | [ A S ] | [ P S ]" fill="none"><title>[ P A ]: 2*x - 2*y = 0</title></path>
      <path class="geom-line quad-line" d="M 666 366.97 L 489.52 190.48 L 313.03 14" data-ref="[ P B ]" data-aliases="[ B P ] | [ B R ] | [ P R ]" fill="none"><title>[ P B ]: 2*x + 2*y - 8 = 0</title></path>
      <path class="geom-line quad-line diagonal-line" d="M 370.8 426 L 439.46 220 L 508.13 14" data-ref="[ P C ]" data-aliases="[ C P ] | [ C Q ] | [ P Q ]" fill="none"><title>[ P C ]: 2*x - 2*y/3 - 8/3 = 0</title></path>
      <path class="geom-line cross-line" d="M 666 84.08 L 381.06 255.04 L 96.13 426" data-ref="[ A Q ]" data-aliases="[ A R ] | [ Q R ]" fill="none"><title>[ A Q ]: -x + 5*y/3 = 0</title></path>
      <path class="geom-line cross-line" d="M 14 37.66 L 340 177.37 L 666 317.09" data-ref="[ B Q ]" data-aliases="[ B S ] | [ Q S ]" fill="none"><title>[ B Q ]: -x - 7*y/3 + 4 = 0</title></path>
      <path class="geom-line carrier-line" d="M 14 279.68 L 340 279.68 L 666 279.68" data-ref="[ A B ]" data-aliases="[ A C ] | [ A D ] | [ B C ] | [ B D ] | [ C D ]" fill="none"><title>[ A B ]: y = 0</title></path>
      <path class="geom-line harmonic-line" d="M 14 299.82 L 340 224.59 L 666 149.36" data-ref="[ R S ]" data-aliases="[ R D ] | [ S D ]" fill="none"><title>[ R S ]: 3*x/10 - 13*y/10 + 6/5 = 0</title></path>
    </g>
    <g id="highlights"></g>
    <g id="points">
      <circle class="geom-point aux-point" cx="439.46" cy="220" r="3.1" data-ref="Q" data-latex-x="\frac{5}{3}" data-latex-y="1"><title>Q = (5/3, 1)</title></circle>
      <circle class="geom-point given-point" cx="340" cy="279.68" r="4.2" data-ref="A" data-latex-x="0" data-latex-y="0"><title>A = (0, 0)</title></circle>
      <circle class="geom-point given-point" cx="578.71" cy="279.68" r="4.2" data-ref="B" data-latex-x="4" data-latex-y="0"><title>B = (4, 0)</title></circle>
      <circle class="geom-point-halo" cx="419.57" cy="279.68" r="8.4" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.6" />
      <circle class="geom-point given-point" cx="419.57" cy="279.68" r="4.2" data-ref="C" data-latex-x="\frac{4}{3}" data-latex-y="0"><title>C = (4/3, 0)</title></circle>
      <circle class="geom-point apex-point aux-point" cx="459.35" cy="160.32" r="3.1" data-ref="P" data-latex-x="2" data-latex-y="2"><title>P = (2, 2)</title></circle>
      <circle class="geom-point meet-point" cx="489.19" cy="190.16" r="4.7" data-ref="R" data-latex-x="\frac{5}{2}" data-latex-y="\frac{3}{2}"><title>R = (5/2, 3/2)</title></circle>
      <circle class="geom-point meet-point" cx="411.61" cy="208.06" r="4.7" data-ref="S" data-latex-x="\frac{6}{5}" data-latex-y="\frac{6}{5}"><title>S = (6/5, 6/5)</title></circle>
      <circle class="geom-point-halo" cx="101.29" cy="279.68" r="9.4" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.6" />
      <circle class="geom-point harmonic-point" cx="101.29" cy="279.68" r="5.2" data-ref="D" data-latex-x="-4" data-latex-y="0"><title>D = (-4, 0)</title></circle>
    </g>
    <g id="labels">
      <text class="geom-label" x="445.82" y="238.71" data-ref="Q">Q</text>
      <text class="geom-label" x="334.15" y="265.24" data-ref="A">A</text>
      <text class="geom-label" x="572.86" y="265.24" data-ref="B">B</text>
      <text class="geom-label" x="400.81" y="269.64" data-ref="C">C</text>
      <text class="geom-label" x="472.65" y="165.08" data-ref="P">P</text>
      <text class="geom-label" x="483.34" y="214.62" data-ref="R">R</text>
      <text class="geom-label" x="405.76" y="193.12" data-ref="S">S</text>
      <text class="geom-label" x="95.44" y="264.24" data-ref="D">D</text>
    </g>
  </g>
</svg>
