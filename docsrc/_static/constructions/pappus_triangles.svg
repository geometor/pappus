      <circle class="geom-point given-point pt-a" cx="387.74" cy="339.35" r="4.2" data-ref="A1" data-latex-x="2" data-latex-y="0"><title>A1 = (2, 0)</title></circle>
      <circle class="geom-point given-point pt-a" cx="530.97" cy="339.35" r="4.2" data-ref="A2" data-latex-x="5" data-latex-y="0"><title>A2 = (5, 0)</title></circle>
      <circle class="geom-point given-point pt-b" cx="292.26" cy="243.87" r="4.2" data-ref="B0" data-latex-x="0" data-latex-y="2"><title>B0 = (0, 2)</title></circle>
      <circle class="geom-point given-point pt-b" cx="387.74" cy="196.13" r="4.2" data-ref="B1" data-latex-x="2" data-latex-y="3"><title>B1 = (2, 3)</title></circle>
      <circle class="geom-point given-point pt-b" cx="578.71" cy="100.65" r="4.2" data-ref="B2" data-latex-x="6" data-latex-y="5"><title>B2 = (6, 5)</title></circle>
      <circle class="geom-point apex-point" cx="101.29" cy="339.35" r="3.8" data-ref="O" data-latex-x="-4" data-latex-y="0"><title>O = (-4, 0)</title></circle>
      <circle class="geom-point-halo" cx="330.45" cy="282.06" r="8.9" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.6" />
      <circle class="geom-point meet-point pappus-even" cx="330.45" cy="282.06" r="4.7" data-ref="M01" data-latex-x="\frac{4}{5}" data-latex-y="\frac{6}{5}"><title>M01 = (4/5, 6/5)</title></circle>
      <circle class="geom-point-halo" cx="451.4" cy="259.78" r="8.9" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.6" />
      <circle class="geom-point meet-point pappus-even" cx="451.4" cy="259.78" r="4.7" data-ref="M12" data-latex-x="\frac{10}{3}" data-latex-y="\frac{5}{3}"><title>M12 = (10/3, 5/3)</title></circle>
      <circle class="geom-point-halo" cx="369.68" cy="274.84" r="8.9" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.6" />
      <circle class="geom-point meet-point pappus-even" cx="369.68" cy="274.84" r="4.7" data-ref="M20" data-latex-x="\frac{60}{37}" data-latex-y="\frac{50}{37}"><title>M20 = (60/37, 50/37)</title></circle>
    </g>
