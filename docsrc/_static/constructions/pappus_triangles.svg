      <path class="geom-line cross-line" d="M 234.49 426 L 371.83 220 L 509.16 14" data-ref="[ A0 B1 ]" data-aliases="[ A0 M01 ] | [ B1 M01 ]" fill="none"><title>[ A0 B1 ]: -3*x + 2*y = 0</title></path>
      <path class="geom-line cross-line" d="M 474.39 426 L 268.39 220 L 62.39 14" data-ref="[ A1 B0 ]" data-aliases="[ A1 M01 ] | [ B0 M01 ]" fill="none"><title>[ A1 B0 ]: -2*x - 2*y + 4 = 0</title></path>
      <path class="geom-line cross-line" d="M 318.43 426 L 483.23 220 L 648.03 14" data-ref="[ A1 B2 ]" data-aliases="[ A1 M12 ] | [ B2 M12 ]" fill="none"><title>[ A1 B2 ]: -5*x + 4*y + 10 = 0</title></path>
      <path class="geom-line cross-line" d="M 617.61 426 L 411.61 220 L 205.61 14" data-ref="[ A2 B1 ]" data-aliases="[ A2 M12 ] | [ B1 M12 ]" fill="none"><title>[ A2 B1 ]: -3*x - 3*y + 15 = 0</title></path>
      <path class="geom-line cross-line" d="M 14 132.57 L 340 262.97 L 666 393.37" data-ref="[ A2 B0 ]" data-aliases="[ A2 M20 ] | [ B0 M20 ]" fill="none"><title>[ A2 B0 ]: -2*x - 5*y + 10 = 0</title></path>
      <path class="geom-line cross-line" d="M 666 27.9 L 427.14 226.95 L 188.28 426" data-ref="[ A0 B2 ]" data-aliases="[ A0 M20 ] | [ B2 M20 ]" fill="none"><title>[ A0 B2 ]: -5*x + 6*y = 0</title></path>
      <path class="geom-line carrier-line" d="M 14 339.35 L 340 339.35 L 666 339.35" data-ref="[ A0 A2 ]" data-aliases="[ A0 A1 ] | [ A0 O ] | [ A1 A2 ] | [ A1 O ] | [ A2 O ]" fill="none"><title>[ A0 A2 ]: y = 0</title></path>
      <path class="geom-line carrier-line" d="M 14 383 L 340 220 L 666 57" data-ref="[ B0 B2 ]" data-aliases="[ B0 B1 ] | [ B0 O ] | [ B1 B2 ] | [ B1 O ] | [ B2 O ]" fill="none"><title>[ B0 B2 ]: -3*x + 6*y - 12 = 0</title></path>
      <path class="geom-line pappus-line pappus-even" d="M 14 340.36 L 340 280.31 L 666 220.25" data-ref="[ M01 M12 ]" data-aliases="[ M01 M20 ] | [ M12 M20 ]" fill="none"><title>[ M01 M12 ]: -7*x/15 + 38*y/15 - 8/3 = 0</title></path>
    </g>
    <g id="highlights"></g>
    <g id="points">
