<svg xmlns="http://www.w3.org/2000/svg" class="euclid-graphic" data-graphic-id="0232.g1" data-folio="0232" data-graphic="g1" viewBox="0 0 218 383" width="218" height="383" role="img" aria-label="Synagoge Book III — Three Classical Medieties Vertical Segments">
  <title>Synagoge Book III — Three Classical Medieties Vertical Segments</title>
  <style>
    .euclid-graphic {
      --geom-fg: #1c1917;
      --geom-bg: #fafaf9;
      --geom-accent: #0284c7;
      --geom-assert: #059669;
      --geom-muted: #64748b;
      font-family: "Gentium Plus", "Noto Serif", Georgia, serif;
    }
    @media (prefers-color-scheme: dark) {
      .euclid-graphic {
        --geom-fg: #f4f4f5;
        --geom-bg: #141417;
        --geom-accent: #38bdf8;
        --geom-assert: #34d399;
        --geom-muted: #94a3b8;
      }
    }
    .euclid-graphic .svg-bg { fill: var(--geom-bg); }
    .euclid-graphic .geom-seg { fill: none; stroke: var(--geom-fg); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .euclid-graphic .geom-dashed { stroke-dasharray: 7 5; stroke: var(--geom-muted); }
    .euclid-graphic .geom-circle { fill: none; stroke: var(--geom-fg); stroke-width: 2.2; }
    .euclid-graphic .geom-overlay { fill: none; stroke: transparent; stroke-width: 6; stroke-linecap: round; pointer-events: none; }
    .euclid-graphic .geom-overlay.is-active { stroke: var(--geom-accent); opacity: 0.85; }
    .euclid-graphic .geom-overlay.is-assert { stroke: var(--geom-assert); opacity: 0.9; }
    .euclid-graphic .geom-point { fill: var(--geom-fg); stroke: var(--geom-bg); stroke-width: 1.4; }
    .euclid-graphic .geom-label {
      fill: var(--geom-fg);
      font-size: 18px;
      font-style: italic;
      font-weight: 600;
      paint-order: stroke fill;
      stroke: var(--geom-bg);
      stroke-width: 4px;
      stroke-linejoin: round;
      user-select: none;
    }
  </style>
